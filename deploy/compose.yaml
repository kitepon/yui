# 自分のサーバーで結を動かすための compose。
#
# この家に固有の値（公開する URL、LAN 直結の宛先、秘密）は、
# すべて同じ場所に置いた `.env` から読む。compose.yaml には書かない。
# 必要な変数は deploy/README.md の表を見る。
name: yuihome

services:
  app:
    # `docker build -t yuihome:local .` で焼くか、自分のレジストリの tag を指す。
    image: yuihome:local
    container_name: yuihome
    restart: unless-stopped
    env_file:
      - .env
    # LAN 直結のコネクタと、ホスト側で動かす自作ブリッジへ届かせるため。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      YUI_DATA_FILE: /data/yui.json
      YUI_IMPORT_JSON: /data/yui.json
      YUI_SQLITE_PATH: /data/yui.sqlite
      TZ: ${TZ:-Asia/Tokyo}
      PORT: "8080"
      HOST: 0.0.0.0
    volumes:
      - yui-data:/data
    ports:
      # 直接インターネットへ晒さない。リバースプロキシ（Caddy 等）の後ろに置く。
      # 別のアドレスで受けるなら .env の YUI_BIND に書く。
      - "${YUI_BIND:-127.0.0.1}:${YUI_PORT:-18861}:8080"
    networks:
      yui:
        # Smart Life の名乗りを受け役がこのアドレスへ渡す。帯は下の yui ネットワーク。
        ipv4_address: ${YUI_APP_ADDR:-172.16.240.10}

  # サーバーの Bluetooth で SwitchBot Bot を押す。COMPOSE_PROFILES=ble のときだけ起動。
  # 結は同じ compose ネットワークの http://switchbot-ble:18862 へ届ける。
  switchbot-ble:
    profiles: ["ble"]
    image: yuihome-switchbot-ble:local
    container_name: yuihome-switchbot-ble
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
    volumes:
      - /run/dbus:/run/dbus
      - /var/run/dbus:/var/run/dbus
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      SWITCHBOT_BLE_BIND: "0.0.0.0"
      SWITCHBOT_BLE_PORT: "18862"
    networks:
      - yui

  # Smart Life の名乗り（UDP 6666 / 6667）をホストの LAN で直接受ける。
  # ルーター再起動でアドレスやリンクが変わると、このプロセスが口を開き直す。
  # ウェブの待受は app の 127.0.0.1 のまま。ここは UDP だけを持つ。
  tuya-lan:
    image: yuihome:local
    container_name: yuihome-tuya-lan
    restart: unless-stopped
    network_mode: host
    command: ["node", "--experimental-strip-types", "src/lib/home/tuya-lan-forward.ts"]
    environment:
      YUI_TUYA_LAN_UPSTREAM: ${YUI_APP_ADDR:-172.16.240.10}
      TZ: ${TZ:-Asia/Tokyo}
    depends_on:
      - app

volumes:
  yui-data:

networks:
  # 帯を固定する。docker の自動割当だと再作成のたびに変わり、
  # ホスト側のファイアウォールで LAN 機器やブリッジへの許可を書いている場合に外れる。
  yui:
    ipam:
      config:
        - subnet: ${YUI_SUBNET:-172.16.240.0/24}
