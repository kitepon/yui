name: 改善提案
description: 使い方や見方を良くする提案を共有する
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: job
    attributes:
      label: 困っていること
      description: どんな場面で、何ができずに困っているかを書いてください。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 提案
      description: 解決案があれば書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 今の代替手段
      description: 現在どのように回避しているかを書いてください。
